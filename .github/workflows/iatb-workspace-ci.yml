name: IA-TB Workspace - build-only CI

on:
  push:
    branches:
      - 'work/**'
    paths:
      - 'App/**'
      - 'Infrastructure/DEBUG_ONLINE/**'
      - '.github/workflows/iatb-workspace-ci.yml'
  pull_request:
    paths:
      - 'App/**'
      - 'Infrastructure/DEBUG_ONLINE/**'
      - '.github/workflows/iatb-workspace-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: iatb-workspace-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  source-build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout workspace commit
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Validate full source present
        run: test -f App/package.json && test -f App/Dockerfile.app
      - name: Static checks
        run: python3 Infrastructure/DEBUG_ONLINE/preflight.py
      - name: Validate DEBUG Online files
        run: |
          set -eu
          python3 Infrastructure/DEBUG_ONLINE/verify_deploy.py
          python3 -m py_compile Infrastructure/DEBUG_ONLINE/install_debug_online.py
          python3 -m py_compile Infrastructure/DEBUG_ONLINE/diagnose.py
          bash -n App/Tools/debug_online_start.sh
          bash -n Infrastructure/DEBUG_ONLINE/ssh/install_gateway.sh
          bash -n Infrastructure/DEBUG_ONLINE/ssh/install_ai_dev.sh
          python3 -m py_compile Infrastructure/DEBUG_ONLINE/ssh/ai_dev_gateway.py
          sh -n Infrastructure/DEBUG_ONLINE/ssh/ssh_gateway.sh
          node --check App/Tools/debug_online_forward.js
          node --check App/Tools/debug_online_operator_cli.js
          docker compose -f Infrastructure/DEBUG_ONLINE/compose.yml config --quiet
      - name: Exercise AI DEV sandbox gateway locally (NO SSH, NO VPS)
        shell: bash
        run: |
          set -Eeuo pipefail
          trap 'sudo rm -rf /var/lib/iatb-ai-dev' EXIT
          sudo mkdir -p /var/lib/iatb-ai-dev/workspace/{drafts,patches,reports}
          sudo chown -R "$(id -u):$(id -g)" /var/lib/iatb-ai-dev
          printf 'hello from CI\n' | SSH_ORIGINAL_COMMAND='write drafts/check.md' \
            python3 Infrastructure/DEBUG_ONLINE/ssh/ai_dev_gateway.py | grep -Fx 'WRITE_OK drafts/check.md'
          SSH_ORIGINAL_COMMAND='read drafts/check.md' \
            python3 Infrastructure/DEBUG_ONLINE/ssh/ai_dev_gateway.py | grep -Fx 'hello from CI'
          SSH_ORIGINAL_COMMAND='list' \
            python3 Infrastructure/DEBUG_ONLINE/ssh/ai_dev_gateway.py | grep -Fx 'drafts/check.md'
          if SSH_ORIGINAL_COMMAND='read ../etc/passwd' \
            python3 Infrastructure/DEBUG_ONLINE/ssh/ai_dev_gateway.py 2>/dev/null; then
            echo 'Unsafe path traversal accepted' >&2
            exit 1
          fi
          if SSH_ORIGINAL_COMMAND='rm -rf /' \
            python3 Infrastructure/DEBUG_ONLINE/ssh/ai_dev_gateway.py 2>/dev/null; then
            echo 'Arbitrary shell command accepted' >&2
            exit 1
          fi
          echo 'PASS: isolated R/W and denied unsafe commands'
      - name: Build full IA-TB image (never start engines)
        run: docker build -f App/Dockerfile.app --pull -t iatb-workspace:ci App
      - name: Verify Auth21 runtime imports inside the built image
        run: |
          set -eu
          docker run --rm --network none --entrypoint node iatb-workspace:ci -e 'const assert=require("node:assert/strict"); const att=require("./Core/Clients/auth21_trading_attestation.js"); assert.equal(typeof att.verify,"function"); const factory=require("./Core/Clients/auth21_trading_admin_bridge").createAuthenticatedDispatcher; assert.equal(typeof factory({sessions:{verifySession:()=>null},env:{IATB_AUTH21_TRADING_ADMIN_BRIDGE:"0"}}),"function"); console.log("PASS: Auth21 trading-admin runtime imports");'
      - name: Seed disposable DEBUG identity database (no RELEASE accounts)
        shell: bash
        run: |
          set -euo pipefail
          scratch="$(mktemp -d)"
          trap 'sudo rm -rf "$scratch"' EXIT
          sudo mkdir -p "$scratch/data"
          sudo chown -R 10053:10053 "$scratch"
          docker run --rm --network none --user 10053:10053 \
            --volume "$scratch:/debug-private" \
            --env IATB_DATA_ROOT=/debug-private/data \
            --entrypoint node iatb-workspace:ci Tools/debug_online_seed_db.js
          sudo test -s "$scratch/data/Database/clients.sqlite"
          sudo test -s "$scratch/data/Security/client_master.key"
          test "$(sudo stat -c %a "$scratch/data/Security/client_master.key")" = 600
      - name: Check package version without running IA-TB
        run: |
          docker run --rm --network none --entrypoint node iatb-workspace:ci \
            -e 'const v=require("./package.json").version; if(!/^[0-9]+[.][0-9]+[.][0-9]+$/.test(v))process.exit(2); console.log("IA-TB:",v);'
      - name: No deployment on CI
        run: echo "Build only. VPS, DNS, RELEASE and user databases not accessed."
