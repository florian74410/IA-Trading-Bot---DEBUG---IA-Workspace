name: IA-TB Workspace - build-only CI

on:
  push:
    branches:
      - 'work/**'
    paths:
      - 'App/**'
      - 'Infrastructure/DEBUG_ONLINE/**'
      - '.github/workflows/iatb-workspace-ci.yml'
  pull_request:
    paths:
      - 'App/**'
      - 'Infrastructure/DEBUG_ONLINE/**'
      - '.github/workflows/iatb-workspace-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: iatb-workspace-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  source-build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout workspace commit
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Validate full source present
        run: test -f App/package.json && test -f App/Dockerfile.app
      - name: Static checks
        run: python3 Infrastructure/DEBUG_ONLINE/preflight.py
      - name: Validate DEBUG Online files
        run: |
          set -eu
          python3 Infrastructure/DEBUG_ONLINE/verify_deploy.py
          python3 -m py_compile Infrastructure/DEBUG_ONLINE/install_debug_online.py
          bash -n App/Tools/debug_online_start.sh
          node --check App/Tools/debug_online_forward.js
          docker compose -f Infrastructure/DEBUG_ONLINE/compose.yml config --quiet
      - name: Build full IA-TB image (never start engines)
        run: docker build -f App/Dockerfile.app --pull -t iatb-workspace:ci App
      - name: Seed disposable DEBUG identity database (no RELEASE accounts)
        shell: bash
        run: |
          set -euo pipefail
          scratch="$(mktemp -d)"
          trap 'sudo rm -rf "$scratch"' EXIT
          sudo mkdir -p "$scratch/data"
          sudo chown -R 10053:10053 "$scratch"
          docker run --rm --network none --user 10053:10053 \
            --volume "$scratch:/debug-private" \
            --env IATB_DATA_ROOT=/debug-private/data \
            --entrypoint node iatb-workspace:ci Tools/debug_online_seed_db.js
          test -s "$scratch/data/Database/clients.sqlite"
          test -s "$scratch/data/Security/client_master.key"
          test "$(stat -c %a "$scratch/data/Security/client_master.key")" = 600
      - name: Check package version without running IA-TB
        run: |
          docker run --rm --network none --entrypoint node iatb-workspace:ci \
            -e 'const v=require("./package.json").version; if(!/^[0-9]+[.][0-9]+[.][0-9]+$/.test(v))process.exit(2); console.log("IA-TB:",v);'
      - name: No deployment on CI
        run: echo "Build only. VPS, DNS, RELEASE and user databases not accessed."
