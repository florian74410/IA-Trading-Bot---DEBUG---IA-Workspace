name: IA-TB Admin Panel security tests
on:
  push:
    branches: ['work/**']
    paths: ['AI Agent/**', '.github/workflows/iatb-admin-panel-ci.yml']
  pull_request:
    paths: ['AI Agent/**', '.github/workflows/iatb-admin-panel-ci.yml']
permissions:
  contents: read
jobs:
  admin-security:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Compile Python and JavaScript
        run: |
          python3 -m py_compile 'AI Agent/AdminPanel/server.py' 'AI Agent/AdminPanel/preflight.py' 'AI Agent/AdminPanel/public_server.py' 'AI Agent/AdminPanel/dns_guard.py'
          node --check 'AI Agent/AdminPanel/app.js'
          bash -n 'AI Agent/AdminPanel/install_phase3.sh'
          bash -n 'AI Agent/AdminPanel/upgrade_phase3.sh'
      - name: Unit, localhost HTTP and security regression tests
        run: python3 -m unittest discover -s 'AI Agent/Tests' -p 'test_*.py' -v
      - name: Verify Phase 3 deployment assets
        shell: bash
        run: |
          set -Eeuo pipefail
          grep -q '^ia.iatb.duckdns.org {' 'AI Agent/AdminPanel/caddy/iatb-admin-phase3.caddy.example'
          grep -q '^    respond @internal_health 404' 'AI Agent/AdminPanel/caddy/iatb-admin-phase3.caddy.example'
          grep -q 'reverse_proxy 127.0.0.1:18083' 'AI Agent/AdminPanel/caddy/iatb-admin-phase3.caddy.example'
          grep -q 'User=iatb-admin-panel' 'AI Agent/AdminPanel/systemd/iatb-admin-public.service.example'
          grep -q 'IPAddressDeny=any' 'AI Agent/AdminPanel/systemd/iatb-admin-public.service.example'
          grep -q 'NoNewPrivileges=yes' 'AI Agent/AdminPanel/systemd/iatb-admin-public.service.example'
          grep -Fq "ORIGINAL='/opt/iatb-admin/AI Agent'" 'AI Agent/AdminPanel/upgrade_phase3.sh'
          grep -Fq 'STAGE="$ROOT/releases/$REV"' 'AI Agent/AdminPanel/upgrade_phase3.sh'
          grep -Fq 'trap cleanup EXIT' 'AI Agent/AdminPanel/upgrade_phase3.sh'
          echo 'Phase 3 manifest safety checks passed'
      - name: Validate isolated Caddy HTTPS site syntax
        shell: bash
        run: |
          set -Eeuo pipefail
          docker run --rm \
            -v "$PWD/AI Agent/AdminPanel/caddy/iatb-admin-phase3.caddy.example:/etc/caddy/Caddyfile:ro" \
            caddy:2.10 caddy validate --config /etc/caddy/Caddyfile --adapter caddyfile
      - name: Regression test extracted code permissions under strict umask
        shell: bash
        run: |
          set -Eeuo pipefail
          grep -Fq 'find "$STAGE/AI Agent" -type d -exec chmod 0755' 'AI Agent/AdminPanel/upgrade_phase3.sh'
          grep -Fq 'find "$STAGE/AI Agent" -type f -exec chmod 0644' 'AI Agent/AdminPanel/upgrade_phase3.sh'
          grep -Fq 'sudo -u "$ACCOUNT" test -r "$STAGE/AI Agent/AdminPanel/public_server.py"' 'AI Agent/AdminPanel/upgrade_phase3.sh'
          stage="$(mktemp -d)"
          trap 'rm -rf "$stage"' EXIT
          mkdir -p "$stage/release"
          tar -cf "$stage/agent.tar" 'AI Agent'
          (
            umask 077
            tar -C "$stage/release" -xf "$stage/agent.tar" --no-same-owner --no-same-permissions
            test "$(stat -c '%a' "$stage/release/AI Agent")" = 700
            find "$stage/release/AI Agent" -type d -exec chmod 0755 {} +
            find "$stage/release/AI Agent" -type f -exec chmod 0644 {} +
          )
          test "$(stat -c '%a' "$stage/release/AI Agent/AdminPanel")" = 755
          test "$(stat -c '%a' "$stage/release/AI Agent/AdminPanel/public_server.py")" = 644
          echo 'Strict umask / read-only source permissions regression passed'
      - name: No remote or privileged execution
        run: echo 'No VPS, SSH credentials, Caddy mutation or RELEASE access in this job.'
